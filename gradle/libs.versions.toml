[versions]
jackson = "2.17.0"
parameter = "2.17.0" # ParameterNamesModule と同版
junit = "5.10.2"

[libraries]
jackson-databind = { group = "com.fasterxml.jackson.core", name = "jackson-databind", version.ref = "jackson" }
jackson-parameternames = { group = "com.fasterxml.jackson.module", name = "jackson-module-parameter-names", version.ref = "parameter" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
